[package]
name = "canvas_core"
version = "0.1.0"
edition = "2021"
description = "Graph canvas engine: culling, LOD draw lists, picking, Barnes-Hut layout. Zero dependencies."

[lib]
name = "canvas_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true